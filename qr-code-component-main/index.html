<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | QR code component</title>
</head> 
<body>
<main>
    <div class="card">
      <div class="qr_code_image">
        <img src="./images/image-qr-code.png" alt="frontend mentor qr code">
      </div>
      <p class="outfit_bold">
          Improve your front-end skills by building projects</p>
      <p class="outfit_regular">
        Scan the QR code to visit Frontend Mentor and take your coding skills to 
        <br>the next level
      </p>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.github.com/dienadalhenrry@gmail.com">Enaya Seifedin</a>.
  </footer>
</body>
</html>
